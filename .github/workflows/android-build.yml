name: Android Build & Sign

permissions:
  contents: read

on:
  push:
    branches: [ "master", "dev" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'Screenshots/**'
      - 'fastlane/**'
      - '**.md'
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'Screenshots/**'
      - 'fastlane/**'
      - '**.md'
  workflow_dispatch: 

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # --- For Pull Requests: Only build an unsigned Debug APK ---
    - name: Build Debug APK (PRs Only)
      if: github.event_name == 'pull_request'
      run: ./gradlew assembleDebug --stacktrace

    # --- For Pushes to dev/master & Manual Runs: Build Release APK ---
    - name: Build Release APK
      if: github.event_name != 'pull_request'
      run: ./gradlew assembleRelease --stacktrace

    # Securely sign the release APK using GitHub Secrets
    - name: Sign Release APK
      if: github.event_name != 'pull_request'
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    # Dynamically extract the versionName
    - name: Get Version Name
      if: success() && github.event_name != 'pull_request'
      id: get_version
      run: |
        VERSION=$(cat app/build.gradle* | grep -oP 'versionName\s*=?\s*"\K[^"]+' | head -n 1 || echo "unknown")
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

    # Upload the Signed APK using the dynamic version name
    - name: Upload Signed APK
      if: success() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: sigil-${{ env.APP_VERSION }}-build-${{ github.run_number }}
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
        retention-days: 14
